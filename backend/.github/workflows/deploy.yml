name: Deploy to Easypanel

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Easypanel rebuild
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "EASYPANEL_DEPLOY_WEBHOOK secret not set — skip"
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
